<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islas Voladoras · Laboratorio</title>
<style>
:root{--bg:#0b1220;--panel:#111c2e;--line:#263750;--text:#e8eef7;--muted:#91a4bd;--accent:#7ed0b0;--ramp:#d2b36f;--land:#718b5d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18283e 0,#0b1220 48%,#070c15 100%);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.top h1{margin:5px 0 0;font-size:28px}.badge{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.panel,.view{background:rgba(17,28,46,.92);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 50px #0004}.panel{padding:18px}.control{margin-bottom:16px}.control label{display:flex;justify-content:space-between;margin-bottom:7px;color:#cbd7e7}.control output{color:var(--accent);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%}.control input[type=number]{width:100%;background:#0b1423;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px}.buttons{display:grid;gap:9px;margin-top:20px}.btn{border:1px solid var(--line);background:#16243a;color:var(--text);padding:11px 13px;border-radius:10px;cursor:pointer;font-weight:700}.btn.primary{background:#1d4d43;border-color:#3f8f7c}.btn:hover{filter:brightness(1.15)}.hint{color:var(--muted);font-size:12px;margin-top:13px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}.view{padding:12px}.view h2{font-size:12px;color:var(--muted);margin:2px 4px 9px;text-transform:uppercase;letter-spacing:.08em}.canvaswrap{aspect-ratio:16/10;background:#08101b;border-radius:10px;overflow:hidden}.canvaswrap canvas{width:100%;height:100%;display:block}.status{margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0c1727;color:#b9c7d9}.status strong{color:var(--accent)}@media(max-width:800px){main{padding:14px}.grid{grid-template-columns:1fr}.views{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<section class="top"><div><div class="eyebrow">Islas Voladoras · ZG</div><h1>Laboratorio rápido de mundo</h1></div><div class="badge">Vista previa · sin tocar el checkpoint</div></section>
<div class="grid">
<aside class="panel">
<div class="control"><label>Seed <output id="seedOut">74191</output></label><input id="seed" type="number" value="74191" step="1"></div>
<div class="control"><label>Ancho de ruta <output id="widthOut">9.0</output></label><input id="width" type="range" min="5" max="16" step="0.5" value="9"></div>
<div class="control"><label>Desnivel por tramo <output id="stepOut">3.0</output></label><input id="step" type="range" min="0.5" max="6" step="0.5" value="3"></div>
<div class="control"><label>Solape de rampas <output id="overlapOut">1.25</output></label><input id="overlap" type="range" min="0.25" max="3" step="0.25" value="1.25"></div>
<div class="buttons"><button class="btn primary" id="copy">Copiar configuración</button><button class="btn" id="download">Descargar JSON</button><button class="btn" id="reset">Restaurar ZG</button><button class="btn" id="game">Abrir preview Godot</button></div>
<div class="hint">Este laboratorio permite experimentar sin editar el proyecto. La vista representa la topología de navegación; el checkpoint ZG sigue intacto.</div>
</aside>
<section><div class="views"><div class="view"><h2>Planta · recorrido</h2><div class="canvaswrap"><canvas id="topView"></canvas></div></div><div class="view"><h2>Perfil · verticalidad</h2><div class="canvaswrap"><canvas id="sideView"></canvas></div></div></div><div class="status" id="status"></div></section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);const defaults={seed:74191,width:9,step:3,overlap:1.25};
function cfg(){return {seed:Number($('seed').value)||defaults.seed,route_width:Number($('width').value),level_step:Number($('step').value),overlap:Number($('overlap').value)}}
function route(c){let y=[2.1,2.1+c.step,2.1+2*c.step,2.1+3*c.step,2.1+4*c.step];return [{x:0,z:8,y:y[0]},{x:0,z:-4,y:y[0]},{x:0,z:-12,y:y[1]},{x:0,z:-20,y:y[1]},{x:-6,z:-27,y:y[2]},{x:-6,z:-35,y:y[2]},{x:-2,z:-42,y:y[3]},{x:-2,z:-50,y:y[3]},{x:6,z:-56,y:y[4]},{x:6,z:-62,y:y[4]}]}
function setupCanvas(c){let d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return [x,r.width,r.height]}
function drawTop(){let [x,w,h]=setupCanvas($('topView')),c=cfg(),pts=route(c);x.fillStyle='#08101b';x.fillRect(0,0,w,h);let sx=(w-50)/58,sz=(h-45)/78,ox=w*.52,oz=25;x.strokeStyle='#263750';x.globalAlpha=.5;for(let i=0;i<8;i++){x.beginPath();x.moveTo(20,20+i*(h-40)/7);x.lineTo(w-20,20+i*(h-40)/7);x.stroke()}x.globalAlpha=1;for(let i=0;i<pts.length;i++){let p=pts[i],px=ox+p.x*sx,pz=oz+(-p.z)*sz;if(i<pts.length-1){let q=pts[i+1],qx=ox+q.x*sx,qz=oz+(-q.z)*sz;x.strokeStyle='#d2b36f';x.lineWidth=Math.max(3,c.route_width/2);x.lineCap='round';x.beginPath();x.moveTo(px,pz);x.lineTo(qx,qz);x.stroke()}x.fillStyle=i%2?'#718b5d':'#9db477';x.beginPath();x.arc(px,pz,5,0,Math.PI*2);x.fill();x.fillStyle='#08101b';x.font='10px system-ui';x.fillText(String(i+1),px+6,pz-6)}x.fillStyle='#91a4bd';x.font='11px system-ui';x.fillText('seed '+c.seed,12,h-12)}
function drawSide(){let [x,w,h]=setupCanvas($('sideView')),c=cfg(),pts=route(c);x.fillStyle='#08101b';x.fillRect(0,0,w,h);let maxY=Math.max(...pts.map(p=>p.y))+1,minY=0,sx=(w-45)/68,sy=(h-45)/(maxY-minY),ox=24,oy=h-22;x.strokeStyle='#263750';x.lineWidth=1;for(let i=0;i<6;i++){let gy=oy-i*(h-45)/5;x.beginPath();x.moveTo(20,gy);x.lineTo(w-15,gy);x.stroke()}x.strokeStyle='#d2b36f';x.lineWidth=5;x.lineCap='round';for(let i=0;i<pts.length-1;i++){let a=pts[i],b=pts[i+1],ax=ox+(-a.z+8)*sx,ay=oy-(a.y-minY)*sy,bx=ox+(-b.z+8)*sx,by=oy-(b.y-minY)*sy;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()}pts.forEach(p=>{let px=ox+(-p.z+8)*sx,py=oy-(p.y-minY)*sy;x.fillStyle='#9db477';x.beginPath();x.arc(px,py,5,0,Math.PI*2);x.fill()});x.fillStyle='#91a4bd';x.font='11px system-ui';x.fillText('altura final: '+pts.at(-1).y.toFixed(2)+' m',12,17)}
function render(){let c=cfg();$('seedOut').textContent=c.seed;$('widthOut').textContent=c.route_width.toFixed(1);$('stepOut').textContent=c.level_step.toFixed(1);$('overlapOut').textContent=c.overlap.toFixed(2);let total=(c.level_step*4).toFixed(2);$('status').innerHTML='<strong>Resultado:</strong> 5 niveles · desnivel acumulado '+total+' m · ruta '+c.route_width.toFixed(1)+' m · seed '+c.seed+'.';drawTop();drawSide()}
['seed','width','step','overlap'].forEach(id=>$(id).addEventListener('input',render));$('reset').onclick=()=>{ $('seed').value=defaults.seed;$('width').value=defaults.width;$('step').value=defaults.step;$('overlap').value=defaults.overlap;render()};$('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(cfg(),null,2));$('status').innerHTML='<strong>Copiado.</strong> Configuración JSON en el portapapeles.'};$('download').onclick=()=>{let b=new Blob([JSON.stringify(cfg(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='islas-voladoras-config.json';a.click();URL.revokeObjectURL(a.href)};$('game').onclick=()=>{location.href='./game/'};addEventListener('resize',render);render();
</script>
</body></html>
