<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ISL · Reel HQ</title><style>html,body{margin:0;background:#03080c;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}#stage{position:fixed;inset:0;background:#03080c}.slide{position:absolute;inset:-2%;opacity:0;transition:opacity 1.3s ease;overflow:hidden}.slide.on{opacity:1}.slide img{width:104%;height:104%;object-fit:cover;image-rendering:auto;transform:scale(1.02);animation:drift 14s ease-in-out infinite alternate;backface-visibility:hidden}.slide:nth-child(even) img{animation-direction:alternate-reverse}@keyframes drift{from{transform:scale(1.02) translate3d(-.7%,0,0)}to{transform:scale(1.08) translate3d(.7%,-.7%,0)}}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#041017f2,#04101788 46%,transparent 76%),linear-gradient(0deg,#041017e8,transparent 58%)}.copy{position:absolute;left:6vw;bottom:10vh;max-width:800px;text-shadow:0 2px 18px #000}.k{font-size:12px;letter-spacing:4px;color:#8defff;font-weight:bold}h1{font-size:clamp(38px,6vw,86px);line-height:.94;margin:10px 0}.n{font-size:clamp(15px,1.7vw,22px);color:#d5e2e5}.badge{position:fixed;left:3vw;top:3vh;z-index:9;font-size:11px;letter-spacing:3px;color:#9fbcc5;background:#061119b8;border:1px solid #ffffff22;padding:9px 12px}.controls{position:fixed;right:3vw;top:3vh;z-index:10;display:flex;gap:7px}.controls button,.controls a{background:#061119cc;border:1px solid #ffffff38;color:#fff;padding:11px 13px;text-decoration:none;font-size:15px;cursor:pointer}.controls button:focus,.controls a:focus{outline:2px solid #8defff}.progress{position:fixed;left:5vw;right:5vw;bottom:4vh;height:3px;background:#ffffff24;z-index:9}.fill{height:100%;width:0;background:#8defff}.wind{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:.16;background:repeating-linear-gradient(165deg,transparent 0 72px,#dffcff18 73px 74px,transparent 75px 150px);animation:wind 12s linear infinite}@keyframes wind{to{transform:translateX(150px)}}@media(prefers-reduced-motion:reduce){.slide img,.wind{animation:none}}</style></head><body><div id="stage"></div><div class="wind"></div><div class="badge">ISL · MODO ESPECTÁCULO HQ</div><div class="controls"><button id="prev" aria-label="Anterior">←</button><button id="pause" aria-label="Pausa">Ⅱ</button><button id="next" aria-label="Siguiente">→</button><button id="full" aria-label="Pantalla completa">⛶</button><a href="index.html">⌂</a></div><div class="progress"><div class="fill" id="fill"></div></div><script>(function(){var slides=[{src:'assets/island-a.svg',k:'MUNDO',t:'Una ciudad aprende a vivir con el viento.',n:'HQ vectorial · resolución independiente · REFERENCIA',ms:8000},{src:'assets/island-b.svg',k:'ITERACIÓN',t:'La belleza también debe dejar jugar.',n:'HQ vectorial · comparación visual · no CANON',ms:8000},{src:'assets/island-a.svg',k:'CUIDADO Y MIMO',t:'La PS4 pierde tecnología, nunca belleza.',n:'Calidad final no negociable · entrega adaptativa',ms:8000}],nodes=[],i=0,start=0,paused=false,raf=0;slides.forEach(function(o){var e=document.createElement('section');e.className='slide';e.innerHTML='<img src="'+o.src+'" alt=""><div class="shade"></div><div class="copy"><div class="k">'+o.k+'</div><h1>'+o.t+'</h1><div class="n">'+o.n+'</div></div>';stage.appendChild(e);nodes.push(e)});function show(n){nodes.forEach(function(e){e.className='slide'});i=(n+nodes.length)%nodes.length;nodes[i].className='slide on';start=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function tick(now){if(!paused){var p=(now-start)/slides[i].ms;if(p>=1){show(i+1);return}fill.style.width=(Math.min(1,p)*100)+'%'}raf=requestAnimationFrame(tick)}prev.onclick=function(){show(i-1)};next.onclick=function(){show(i+1)};pause.onclick=function(){paused=!paused;pause.textContent=paused?'▶':'Ⅱ';if(!paused){start=performance.now()-(parseFloat(fill.style.width)||0)/100*slides[i].ms}};full.onclick=function(){var d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().catch(function(){});else if(d.webkitRequestFullscreen)d.webkitRequestFullscreen()};document.addEventListener('dblclick',function(){full.click()});show(0)})();</script></body></html>
