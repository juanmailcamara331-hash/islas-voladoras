<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISL · Pesca Aérea</title><style>
:root{--bg:#071017;--fg:#f4efe7;--cyan:#8defff;--gold:#ffc36e;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#21475a,#071017 60%);color:var(--fg);font-family:system-ui,sans-serif;min-height:100vh}.w{width:min(880px,94vw);margin:auto;padding:28px 0 70px}.p{border:1px solid var(--line);border-radius:22px;padding:22px;background:#0b1820dc;box-shadow:0 30px 90px #0008}.k{font-size:10px;letter-spacing:.18em;color:var(--cyan)}h1{font-size:clamp(48px,9vw,96px);line-height:.86;margin:8px 0}.sub{color:#c7d4d7;max-width:680px;line-height:1.5}.sky{height:300px;border:1px solid #365865;border-radius:18px;margin:16px 0;background:linear-gradient(#102b38,#08141a);position:relative;overflow:hidden}.cloud{position:absolute;font-size:50px;opacity:.6}.c1{left:10%;top:16%}.c2{right:12%;top:32%}.hook{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:48px;transition:top .1s linear}.meter{height:14px;border:1px solid #365865;border-radius:999px;background:#071017;overflow:hidden}.zone{height:100%;width:22%;margin-left:39%;background:#ffc36e66}.mark{height:100%;width:4%;background:#8defff;transform:translateX(0)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #4b7480;background:#12313a;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}.gold{border-color:#8a6a3d;background:#30271d}.log{margin-top:12px;border-left:3px solid var(--gold);padding:12px;background:#111714;border-radius:8px;color:#c8d5d8}.count{margin-top:8px;color:#9eb2b7;font-size:11px}.skyFish{position:absolute;font-size:28px;opacity:.8;animation:drift 6s linear infinite}.fA{left:-10%;top:32%;animation-delay:-1s}.fB{left:-18%;top:55%;animation-duration:8s}.fC{left:-12%;top:72%;animation-delay:-3s;animation-duration:7s}.catchBurst{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.4);opacity:0;font-size:42px;font-weight:900;color:var(--gold);text-shadow:3px 3px 0 #000;pointer-events:none}.catchBurst.show{animation:burst .8s steps(5,end)}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(900px)}}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}</style><link rel="stylesheet" href="recreo-pixel.css"><link rel="stylesheet" href="isl-global-shell.css">
</head><body class="pixel-isl"><div class="pixelShell"><div class="pixelTop"><div class="pixelBrand">ISL // DISTRITO RECREO</div><div class="pixelNav"><a class="pixelBtn" href="recreo.html">← MAPA RECREO</a><a class="pixelBtn" href="rpg-home.html">CABINA RPG</a></div></div></div><main class="w"><section class="p"><div class="k">RECREO · PESCA AÉREA · HIPÓTESIS</div><h1>Pesca Aérea</h1><p class="sub">Aquí no hay agua. Tampoco peces fiables. Pulsa Lanzar y recoge cuando el marcador pase por la zona central.</p><div class="sky" id="sky"><div class="cloud c1 fxFloat">☁</div><div class="cloud c2 fxFloat">☁</div><div class="skyFish fA">✦</div><div class="skyFish fB">🐟</div><div class="skyFish fC">◌</div><div class="hook" id="hook">🪝</div><div class="catchBurst" id="catchBurst"></div></div><div class="meter"><div class="zone"><div class="mark" id="mark"></div></div></div><div class="actions"><button class="btn" id="cast">Lanzar</button><button class="btn gold" id="pull" disabled>Recoger</button><a class="btn" href="recreo.html">Volver</a></div><div class="log" id="log">El cielo está mordiendo hoy.</div><div class="count" id="count"></div></section></main><script>
let active=false,x=0,dir=1,timer;const mark=document.getElementById('mark'),hook=document.getElementById('hook'),log=document.getElementById('log'),pull=document.getElementById('pull'),burst=document.getElementById('catchBurst');
function inv(){try{return JSON.parse(localStorage.getItem('isl_recreo_loot')||'[]')}catch(e){return[]}}function add(id){let a=inv();if(!a.includes(id))a.push(id);localStorage.setItem('isl_recreo_loot',JSON.stringify(a))}
function tick(){x+=dir*3;if(x>=96||x<=0)dir*=-1;mark.style.transform='translateX('+x+'%)';hook.style.top=(20+x*.55)+'%'}
cast.onclick=()=>{if(active)return;active=true;x=0;dir=1;pull.disabled=false;cast.disabled=true;timer=setInterval(tick,60);log.textContent='Algo tira del hilo. Probablemente no debería.'};
pull.onclick=()=>{if(!active)return;clearInterval(timer);active=false;pull.disabled=true;cast.disabled=false;const good=x>=32&&x<=68;let catches=+localStorage.getItem('isl_air_fishing_catches')||0;if(good){catches++;localStorage.setItem('isl_air_fishing_catches',catches);const pool=[['pez-cometa','Pez Cometa'],['botella-viento','Botella con Viento'],['calcetin-aereo','Calcetín Aéreo']];const c=pool[Math.floor(Math.random()*pool.length)];add(c[0]);burst.textContent='+'+c[1].toUpperCase();burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show');log.textContent='¡Captura! '+c[1]+' añadido a tu mochila de Recreo.'}else log.textContent='Sólo has pescado una corriente enfadada.';count.textContent='Capturas: '+catches};
count.textContent='Capturas: '+ (+localStorage.getItem('isl_air_fishing_catches')||0);
</script><script>(function(){if(location.search.indexOf('embed=1')>=0)document.body.classList.add('embed')})();</script><script defer src="isl-global-shell.js"></script>
<script defer src="playtest-friends.js"></script></body></html>
