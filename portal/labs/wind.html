<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ISL Wind Lab · Portal</title><style>:root{--b:#071017;--p:#10202a;--l:#294955;--c:#8defff;--g:#dfff7b;--t:#edf7f4;--m:#91a8ae}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--b);color:var(--t);font-family:Arial,sans-serif}body{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.top,.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b171f;border-color:var(--l)}.top{border-bottom:1px solid var(--l)}.bar{border-top:1px solid var(--l)}b{letter-spacing:.08em}button,select{background:#0c1921;color:white;border:1px solid var(--l);padding:9px 10px}button:focus,button:hover{border-color:var(--c)}.spacer{flex:1}.score{font-size:20px;color:var(--g)}main{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(#132a39,#54727d 55%,#c58e66 100%)}.goal{position:absolute;right:8%;top:43%;width:48px;height:70px;border:4px solid var(--c);background:#e9ffff33;box-shadow:0 0 28px #8defff55}.goal:after{content:'OBJ';position:absolute;top:-22px;left:4px;font-size:9px;color:var(--c)}.hint{position:absolute;left:12px;bottom:12px;max-width:560px;background:#061017cc;border:1px solid var(--l);padding:8px;font-size:11px;color:#c7d7da}.note{font-size:10px;color:var(--m)}@media(max-width:700px){b{display:none}.top,.bar{padding:6px}.hint{font-size:9px;max-width:70%}}</style></head><body><div class="top"><b>ISL // WIND LAB · PORTAL</b><select id="mode"><option value="redirect">Redirigir</option><option value="stabilize">Estabilizar</option><option value="split">Dividir</option></select><button id="left">↙</button><button id="straight">→</button><button id="right">↗</button><span class="spacer"></span><span id="pieces">0/2</span><span class="score" id="score">0%</span><a style="color:#8defff" href="../index.html">⌂</a></div><main><canvas id="c"></canvas><div class="goal"></div><div class="hint">Dibuja hasta dos deflectores. Arrástralos para cambiar el flujo. Esta versión web compacta conserva el verbo del Wind Lab: <b>ver flujo → dibujar → corregir → entender</b>.</div></main><div class="bar"><button id="clear">Limpiar</button><button id="rotL">−15°</button><button id="rotR">+15°</button><span class="note">LAB / PROTOTIPO · IA interpreta; ISL valida; el mundo responde.</span></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,ps=[],sh=[],draw=false,cur=[],sel=-1,ang=0,t=0,score=0;function rs(){W=c.width=c.clientWidth;H=c.height=c.clientHeight;ps=Array.from({length:150},()=>({x:10+Math.random()*20,y:H*.25+Math.random()*H*.5,v:.7+Math.random()*.7,p:Math.random()*6.28}))}addEventListener('resize',rs);rs();function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function cen(a){return a.reduce((s,p)=>({x:s.x+p.x/a.length,y:s.y+p.y/a.length}),{x:0,y:0})}function hit(p,s){let cc=cen(s.p),d=Math.hypot(p.x-cc.x,p.y-cc.y);return d<50}c.onpointerdown=e=>{let p=pt(e),h=sh.findIndex(s=>hit(p,s));if(h>=0){sel=h;c.setPointerCapture(e.pointerId);c._drag=p}else{draw=true;cur=[p]}};c.onpointermove=e=>{let p=pt(e);if(draw)cur.push(p);else if(sel>=0&&c._drag){let dx=p.x-c._drag.x,dy=p.y-c._drag.y;sh[sel].p.forEach(q=>{q.x+=dx;q.y+=dy});c._drag=p}};c.onpointerup=e=>{if(draw&&cur.length>6){if(sh.length>=2)sh.shift();sh.push({p:cur.slice(),r:0});sel=sh.length-1}draw=false;cur=[];c._drag=null;document.getElementById('pieces').textContent=sh.length+'/2'};function flow(p){let vx=Math.cos(ang)*2.2,vy=Math.sin(ang)*1.2+.08*Math.sin(t*.7+p.y*.02+p.p);for(let s of sh){let cc=cen(s.p),dx=p.x-cc.x,dy=p.y-cc.y,d=Math.hypot(dx,dy);if(d<85){let k=(1-d/85);vy+=Math.sin((s.r||0)*Math.PI/180)*2.2*k+(dy>=0?1:-1)*.9*k;vx*=1-.18*k}}return{vx,vy}}function poly(a,col){if(!a.length)return;x.beginPath();x.moveTo(a[0].x,a[0].y);a.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.strokeStyle=col;x.lineWidth=6;x.stroke();x.lineWidth=1}function frame(){t+=.016;x.clearRect(0,0,W,H);let hits=0,seen=0;for(let p of ps){let f=flow(p);x.strokeStyle='#bffbff';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-f.vx*5,p.y-f.vy*5);x.stroke();p.x+=f.vx*p.v;p.y+=f.vy*p.v;if(p.x>W*.78){seen++;if(p.y>H*.42&&p.y<H*.58)hits++}if(p.x>W||p.y<0||p.y>H){p.x=10+Math.random()*15;p.y=H*.25+Math.random()*H*.5}}sh.forEach((s,i)=>poly(s.p,i===sel?'#dfff7b':'#ffc36e'));if(draw)poly(cur,'#fff3c3');let q=seen?hits/seen:0;score=score*.93+q*.07;document.getElementById('score').textContent=Math.round(score*100)+'%';requestAnimationFrame(frame)}frame();left.onclick=()=>ang=.18;straight.onclick=()=>ang=0;right.onclick=()=>ang=-.18;clear.onclick=()=>{sh=[];sel=-1;pieces.textContent='0/2'};rotL.onclick=()=>{if(sel>=0)sh[sel].r-=15};rotR.onclick=()=>{if(sel>=0)sh[sel].r+=15};</script></body></html>
