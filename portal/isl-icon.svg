 <path d="M146 389c58 22 162 24 222 0" fill="none" stroke="#f4dfb2" stroke-width="9" stroke-linecap="round"/>
 <text x="256" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f8e7c3">ISLAS VOLADORAS</text>
</g>
