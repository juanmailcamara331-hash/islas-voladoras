<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
<title id="t">ISL · Islas Voladoras</title><desc id="d">Brújula dorada, isla flotante, molino y doble negación.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ae"/><stop offset=".34" stop-color="#ffc36e"/><stop offset=".72" stop-color="#a96825"/><stop offset="1" stop-color="#ffe4a0"/></linearGradient>
 <linearGradient id="rock" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#3d5360"/><stop offset=".55" stop-color="#172d38"/><stop offset="1" stop-color="#071017"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8d97b"/><stop offset=".45" stop-color="#557d49"/><stop offset="1" stop-color="#1c4738"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<!-- transparent canvas; artwork intentionally fills the safe area -->
