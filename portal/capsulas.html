<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ISL · Cápsulas</title>
<style>
:root{--bg:#061018;--fg:#f4efe7;--mut:#a8bac0;--cyan:#8defff;--gold:#ffc36e;--line:#ffffff22}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#24475a 0,transparent 28%),linear-gradient(#061018,#0a141c);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{width:min(1180px,94vw);margin:auto;padding:28px 0 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.k{font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}.back{color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:10px;background:#0b1820}
h1{font-size:clamp(42px,8vw,90px);line-height:.9;margin:16px 0 12px}.lead{color:#d5e0e2;max-width:760px;line-height:1.55}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}.card{min-height:390px;border:1px solid var(--line);background:#0b1820dd;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 22px 70px #0007;position:relative}.visual{height:205px;position:relative;overflow:hidden;background:#071017}.visual img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.78) contrast(1.08);transition:transform .5s ease}.card:hover .visual img{transform:scale(1.035)}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0b1820 0,transparent 65%)}.inner{padding:18px;display:flex;flex:1;flex-direction:column;justify-content:space-between}.type{font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.copy{font-size:clamp(20px,3vw,30px);line-height:1.12;font-weight:800;margin:14px 0}.small{color:var(--mut);line-height:1.5}.dark{background:linear-gradient(180deg,#17131a,#090b0f)}.decision button{width:100%;margin-top:7px;padding:12px;border:1px solid #ffffff28;background:#10232c;color:white;border-radius:10px;text-align:left}.decision button:focus{outline:3px solid var(--cyan);outline-offset:2px}.picked{border-color:var(--gold)!important;color:var(--gold)!important}.card[data-capsule]{cursor:pointer}.card[data-capsule]:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.capsuleModal{position:fixed;inset:0;z-index:2147481000;display:none;align-items:center;justify-content:center;padding:18px;background:#02070bd9;backdrop-filter:blur(12px)}.capsuleModal.show{display:flex}.capsuleModalCard{width:min(760px,95vw);max-height:86vh;overflow:auto;border:1px solid #456775;border-radius:20px;background:linear-gradient(180deg,#10242d,#071018);box-shadow:0 30px 90px #000d}.capsuleModalCard img{width:100%;height:min(42vh,360px);object-fit:cover}.capsuleModalCopy{padding:18px}.capsuleModalCopy h2{font-size:clamp(30px,6vw,58px);line-height:.95;margin:8px 0 12px}.capsuleModalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.capsuleModalActions button,.capsuleModalActions a{border:1px solid #456775;border-radius:10px;background:#0a1a22;color:#fff;padding:10px 12px;text-decoration:none;font-weight:900}.footer{margin-top:28px;color:var(--mut);font-size:12px}.tv .wrap{width:min(1500px,96vw)}.tv .deck{grid-template-columns:repeat(3,1fr)}@media(max-width:760px){.top{align-items:flex-start}.deck{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="isl-global-shell.css">
</head><body><div class="wrap">
<div class="top"><div><div class="k">Modo descanso · ISL</div></div><a class="back" href="index.html">← Centro</a></div>
<h1>Cápsulas del cielo</h1><p class="lead">Nada que cerrar. Nada que producir. Sólo mirar, reírse un poco, dejar que el mundo se pegue y, como mucho, tomar una decisión pequeña.</p>
<div id="deck" class="deck"></div>
<div class="footer">ISL · cápsulas v0.20 · nada de aquí entra a CANON sin pasar por metodología.</div>
</div><script>
if(/PlayStation 4/i.test(navigator.userAgent))document.body.classList.add('tv');
const deck=document.getElementById('deck');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const capsuleArt=['assets/ship-between-islands.png','assets/floating-island-level.png','assets/floating-islands-lookout.png','assets/tower-echoes.png','assets/wind-lab-sunset.png','assets/visual-bible-islands.png','assets/floating-ruins-guide.png','assets/floating-islands-map.png'];
const isPS4=/PlayStation 4/i.test(navigator.userAgent);
const onNetlify=/\.netlify\.app$/i.test(location.hostname);
function artUrl(path,w=800){
  if(!onNetlify||isPS4)return path;
  return '/.netlify/images?url=/'+path+'&w='+w+'&q=74';
}
function render(items){
 window.__islCapsuleItems=items;\n deck.innerHTML=items.map((x,idx)=>{
   const dark=x.tone==='dark'?' dark':'',art=capsuleArt[idx%capsuleArt.length];
   const head='<div class="visual"><img src="'+artUrl(art,800)+'" srcset="'+artUrl(art,480)+' 480w, '+artUrl(art,800)+' 800w, '+artUrl(art,1200)+' 1200w" sizes="(max-width:760px) 94vw, (max-width:1180px) 45vw, 360px" loading="lazy" decoding="async" fetchpriority="low" width="800" height="460" alt="Escena ISL"></div><div class="inner"><div><div class="type">'+esc(x.type)+'</div>';
   if(x.options){
     return '<article tabindex="0" data-capsule="'+idx+'" class="card decision'+dark+'">'+head+'<div class="copy">'+esc(x.title)+'</div><div class="small">'+esc(x.body)+'</div></div><div>'+x.options.map((o,i)=>'<button data-id="'+esc(x.id)+'" data-choice="'+i+'">'+String.fromCharCode(65+i)+' · '+esc(o)+'</button>').join('')+'</div></div></article>';
   }
   return '<article tabindex="0" data-capsule="'+idx+'" class="card'+dark+'">'+head+'<div class="copy">'+esc(x.title||x.body).replace(/\n/g,'<br>')+'</div></div><div class="small">'+esc(x.title?x.body:x.note).replace(/\n/g,'<br>')+(x.title&&x.note?'<br><br>'+esc(x.note):'')+'</div></div></article>'
 }).join('');
 var modal=document.getElementById('capsuleModal');if(!modal){modal=document.createElement('div');modal.id='capsuleModal';modal.className='capsuleModal';modal.innerHTML='<div class="capsuleModalCard" role="dialog" aria-modal="true"><img id="capsuleModalImg" alt=""><div class="capsuleModalCopy"><div class="type" id="capsuleModalType"></div><h2 id="capsuleModalTitle"></h2><div class="small" id="capsuleModalBody"></div><div class="capsuleModalActions"><button id="capsuleKeep" type="button">GUARDAR ECO</button><a href="capsulas-tv.html?resume=1">VER EN MODO TV</a><button id="capsuleClose" type="button">CERRAR</button></div></div></div>';document.body.appendChild(modal)}
 function openCapsule(idx){var x=window.__islCapsuleItems&&window.__islCapsuleItems[idx];if(!x)return;document.getElementById('capsuleModalImg').src=artUrl(capsuleArt[idx%capsuleArt.length],1200);document.getElementById('capsuleModalType').textContent=x.type||'CÁPSULA';document.getElementById('capsuleModalTitle').textContent=x.title||'Cápsula ISL';document.getElementById('capsuleModalBody').textContent=x.body||x.note||'';modal.classList.add('show');document.getElementById('capsuleKeep').onclick=function(){localStorage.setItem('isl_capsule_seen_'+(x.id||idx),new Date().toISOString());this.textContent='ECO GUARDADO ✓'};document.getElementById('capsuleClose').onclick=function(){modal.classList.remove('show')}}
 deck.querySelectorAll('.card[data-capsule]').forEach(function(card){card.addEventListener('click',function(e){if(e.target.closest('button'))return;openCapsule(+card.dataset.capsule)});card.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();openCapsule(+card.dataset.capsule)}})});
 modal.addEventListener('pointerdown',function(e){if(e.target===modal)modal.classList.remove('show')});
 deck.querySelectorAll('.decision button').forEach(b=>b.onclick=()=>{
   deck.querySelectorAll('[data-id="'+b.dataset.id+'"]').forEach(x=>x.classList.remove('picked'));
   b.classList.add('picked');
   localStorage.setItem('isl_capsule_'+b.dataset.id,b.textContent);
 });
}
fetch('isl-capsules-current.json').then(r=>r.json()).then(j=>render(j.capsules||[])).catch(()=>render([
 {type:'CÁPSULAS ISL',title:'El viento se ha llevado el archivo.',body:'Recarga dentro de un rato. Incluso los datos flotan aquí.',note:'',tone:'dark'}
]));
</script><script defer src="isl-global-shell.js"></script>
</body></html>
