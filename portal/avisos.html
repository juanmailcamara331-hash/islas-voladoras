<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ISL · Avisos</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#071017">
<style>
:root{--bg:#071017;--fg:#f3f0e8;--mut:#9fb1b7;--cyan:#87efff;--gold:#ffc36e;--line:#294955}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#24495d 0,transparent 28%),linear-gradient(#071017,#09151c);color:var(--fg);font-family:system-ui,sans-serif;min-height:100vh}
.wrap{width:min(980px,94vw);margin:auto;padding:28px 0 80px}.top{display:flex;justify-content:space-between;gap:12px}.k{font-size:10px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}h1{font-size:clamp(46px,8vw,92px);line-height:.9;margin:18px 0}.lead{color:#d1dee1;font-size:clamp(18px,2.4vw,27px);line-height:1.45}.btn{border:1px solid var(--line);background:#0d1b23;color:white;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:750}.primary{background:#15333c;border-color:#4a8993}.grid{display:grid;gap:12px;margin-top:24px}.card{border:1px solid var(--line);background:#0c1921dd;border-radius:16px;padding:16px}.kind{font-size:10px;letter-spacing:.13em;color:var(--gold);text-transform:uppercase}.title{font-size:24px;font-weight:850;margin:7px 0}.body{color:var(--mut);line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{margin-top:14px;padding:11px 13px;border-left:3px solid var(--cyan);background:#0a171e;color:#d4e2e5}
</style><link rel="stylesheet" href="isl-global-shell.css">
</head><body><main class="wrap">
<div class="top"><div class="k">ISL · CENTRO DE AVISOS</div><a class="btn" href="index.html">← Centro</a></div>
<h1>Que el cielo te avise.</h1>
<p class="lead">Avisos con alma ISL: recreo, playtest, música, decisiones y cambios importantes. Nada de spam operativo.</p>
<div class="row"><button id="allow" class="btn primary">ACTIVAR NOTIFICACIONES</button><button id="test" class="btn">PROBAR AVISO</button><button id="install" class="btn" hidden>INSTALAR ISL</button></div>
<div id="status" class="status">Comprobando capacidades…</div>
<section id="grid" class="grid"></section>
</main>
<script>
(function(){
 const allow=document.getElementById('allow'),test=document.getElementById('test'),install=document.getElementById('install'),status=document.getElementById('status'),grid=document.getElementById('grid');
 let deferredInstall=null;
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;install.hidden=false});
 install.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;install.hidden=true};

 const native=!!window.ISLNativeNotifications;
 function paintStatus(){
   if(native){
     let ok=false;try{ok=window.ISLNativeNotifications.hasPermission()}catch(e){}
     status.textContent=ok?'Android nativo activo · mañana + tarde · Misiones/Crecer conectados.':'Android nativo listo · toca ACTIVAR y acepta el permiso del sistema.';
     return;
   }
   const n=('Notification'in window)?Notification.permission:'no soportado';
   status.textContent='Modo web/PWA · notificaciones: '+n+'. Para avisos fiables con la app cerrada usa el APK nativo.';
 }
 allow.onclick=async()=>{
   if(native){try{window.ISLNativeNotifications.requestPermission();status.textContent='Permiso solicitado · acepta el diálogo de Android.';setTimeout(paintStatus,1500)}catch(e){status.textContent='No se pudo abrir el permiso nativo.'}return}
   if(!('Notification'in window)){paintStatus();return}
   try{await Notification.requestPermission()}catch(e){}
   paintStatus();
 };
 test.onclick=async()=>{
   if(native){try{window.ISLNativeNotifications.testNotification();status.textContent='Aviso nativo de prueba enviado. Si no aparece, activa el permiso de Android.'}catch(e){status.textContent='Falló la prueba nativa.'}return}
   if(!('Notification'in window)){paintStatus();return}
   try{
     if(Notification.permission!=='granted')await Notification.requestPermission();
     if(Notification.permission==='granted'){
       const reg=await navigator.serviceWorker.ready;
       await reg.showNotification('ISL · Parte de navegación',{body:'Capitán: una misión, no veinte.',icon:'isl-icon-master.png',badge:'isl-icon-master.png',data:{url:'mission-map.html'}});
     }
   }catch(e){}
   paintStatus();
 };
 if('serviceWorker'in navigator&&!native)navigator.serviceWorker.register('sw.js').catch(()=>{});

 const escapeHtml=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 Promise.all([
   fetch('isl-mission-state.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({missions:[]})),
   fetch('isl-notices-current.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({notices:[]}))
 ]).then(([m,n])=>{
   const now=(m.missions||[]).find(x=>x.lane==='NOW');
   const growth=(m.missions||[]).find(x=>x.lane==='GROWTH');
   const live=[];
   if(now)live.push({kind:'MISIÓN',title:'La brújula marca una sola isla',body:'Hoy: '+now.title+'. Haz eso y deja respirar al resto.',url:now.deep_link||'mission-map.html'});
   if(growth)live.push({kind:'CRECER',title:'Hay botín fuera del combate',body:'Making, mockup, stream o campaña: una pieza pequeña puede alimentar varias rutas.',url:growth.deep_link||'crecimiento.html'});
   live.push({kind:'OBSERVATORIO',title:'Antes de remar más fuerte, mira la marea',body:'Tiempo, coste, distribución y riesgo están juntos para decidir qué merece energía.',url:'project-observatory.html'});
   const all=live.concat((n.notices||[]).slice(0,2));
   grid.innerHTML=all.map(x=>'<article class="card"><div class="kind">'+escapeHtml(x.kind)+'</div><div class="title">'+escapeHtml(x.title)+'</div><div class="body">'+escapeHtml(x.body)+'</div><div class="row"><a class="btn" href="'+escapeHtml(x.url)+'">ABRIR</a></div></article>').join('');
 });
 paintStatus();
})();
</script><script defer src="isl-global-shell.js"></script>
</body></html>
