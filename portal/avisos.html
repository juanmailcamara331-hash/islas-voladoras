<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ISL · Avisos</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#071017">
<style>
:root{--bg:#071017;--fg:#f3f0e8;--mut:#9fb1b7;--cyan:#87efff;--gold:#ffc36e;--line:#294955}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#24495d 0,transparent 28%),linear-gradient(#071017,#09151c);color:var(--fg);font-family:system-ui,sans-serif;min-height:100vh}
.wrap{width:min(980px,94vw);margin:auto;padding:28px 0 80px}.top{display:flex;justify-content:space-between;gap:12px}.k{font-size:10px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}h1{font-size:clamp(46px,8vw,92px);line-height:.9;margin:18px 0}.lead{color:#d1dee1;font-size:clamp(18px,2.4vw,27px);line-height:1.45}.btn{border:1px solid var(--line);background:#0d1b23;color:white;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:750}.primary{background:#15333c;border-color:#4a8993}.grid{display:grid;gap:12px;margin-top:24px}.card{border:1px solid var(--line);background:#0c1921dd;border-radius:16px;padding:16px}.kind{font-size:10px;letter-spacing:.13em;color:var(--gold);text-transform:uppercase}.title{font-size:24px;font-weight:850;margin:7px 0}.body{color:var(--mut);line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{margin-top:14px;padding:11px 13px;border-left:3px solid var(--cyan);background:#0a171e;color:#d4e2e5}
</style></head><body><main class="wrap">
<div class="top"><div class="k">ISL · CENTRO DE AVISOS</div><a class="btn" href="index.html">← Centro</a></div>
<h1>Que el cielo te avise.</h1>
<p class="lead">Avisos con alma ISL: recreo, playtest, música, decisiones y cambios importantes. Nada de spam operativo.</p>
<div class="row"><button id="allow" class="btn primary">ACTIVAR NOTIFICACIONES</button><button id="test" class="btn">PROBAR AVISO</button><button id="install" class="btn" hidden>INSTALAR ISL</button></div>
<div id="status" class="status">Comprobando capacidades…</div>
<section id="grid" class="grid"></section>
</main>
<script>
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;install.hidden=false});
install.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;install.hidden=true};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
function paintStatus(){
 const n=('Notification'in window)?Notification.permission:'no soportado';
 status.textContent='Notificaciones: '+n+'. Los avisos programados con la app cerrada requieren push/Calendar; aquí funcionan feed + avisos nativos bajo interacción.';
}
allow.onclick=async()=>{if(!('Notification'in window)){paintStatus();return}await Notification.requestPermission();paintStatus()};
test.onclick=async()=>{if(!('Notification'in window))return;if(Notification.permission!=='granted'){await Notification.requestPermission()}if(Notification.permission==='granted'){const reg=await navigator.serviceWorker.ready;reg.showNotification('ISL · El viento ha cambiado de idea',{body:'Aviso de prueba. Si lees esto, el Centro puede hablarte.',icon:'isl-icon-master.png',badge:'isl-icon-master.png',data:{url:'recreo.html'}})}paintStatus()};
fetch('isl-notices-current.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{grid.innerHTML=(j.notices||[]).map(x=>'<article class="card"><div class="kind">'+x.kind+'</div><div class="title">'+x.title+'</div><div class="body">'+x.body+'</div><div class="row"><a class="btn" href="'+x.url+'">ABRIR</a></div></article>').join('')});
paintStatus();
</script></body></html>
