<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISL · GYM 3D Asset</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{--bg:#071017;--panel:#0d1b23;--line:#294955;--text:#eef8f5;--mut:#92a8ae;--gold:#ffc36e;--cyan:#87efff;--good:#bcefc6;--bad:#ffb7ae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{width:min(1100px,94vw);margin:auto;padding:24px 0 80px}
a{color:inherit}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.k{font-size:10px;letter-spacing:.14em;color:var(--cyan);font-weight:900}.btn{border:1px solid var(--line);padding:9px 12px;border-radius:9px;text-decoration:none;font-size:10px;font-weight:900}
.hero,.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;margin-top:12px}.hero h1{font-size:clamp(36px,7vw,72px);line-height:.9;margin:8px 0}.mut{color:var(--mut);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:12px}.card h2{margin:4px 0 8px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:8px;font-weight:900;margin:2px}.warn{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}
ul{padding-left:18px}li{margin:5px 0;font-size:12px;color:#c9d8db}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="k">ISL · TEST GYM · GYM_3D_ASSET</div><div><a class="btn" href="galeria.html">GALERÍA</a> <a class="btn" href="command-center.html?full=1#home">CENTRO</a></div></div>
<section class="hero"><div class="k">AISLADO · DETERMINISTA · NO CANON</div><h1>3D Asset Gym</h1><p class="mut">Superficie mínima para inspeccionar el estado de los activos 3D sin abrir el juego completo. Lee las Asset Health Cards; no promociona ningún activo ni sustituye Blender/validator/human gate.</p></section>
<div id="grid" class="grid"></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/isl-asset-health-current.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
 grid.innerHTML=(d.assets||[]).map(a=>{
   const req=(a.qa_required||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
   const state=String(a.state||'UNKNOWN');
   const cls=/BLOCKED|PENDING/.test(state)?'warn':/FAIL/.test(state)?'bad':'good';
   return '<article class="card"><div class="k">'+esc(a.asset_id)+'</div><h2>'+esc(a.display_name||a.entity_id)+'</h2><div class="tag '+cls+'">'+esc(state)+'</div><div class="tag">HUMAN '+esc(a.human_gate)+'</div><p class="mut">'+esc(a.next||'')+'</p>'+(req?'<ul>'+req+'</ul>':'')+'</article>';
 }).join('');
}).catch(e=>grid.innerHTML='<article class="card bad">No se pudo cargar Asset Health.</article>');
</script>
</body></html>
