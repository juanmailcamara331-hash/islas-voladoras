[build]
  command = "bash netlify-public-build.sh"
  publish = "build/public"
  # COST AIRLOCK: normal commits NEVER deploy production.
  # To intentionally release, modify NETLIFY_DEPLOY_v0.7.2.md in that release commit.
  # Netlify's ignore command exits 0 when the release marker did not change, so the build is skipped.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- NETLIFY_DEPLOY_v0.7.2.md"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; manifest-src 'self'; worker-src 'self' blob:"

[[headers]]
  for = "/ISL_*"
  [headers.values]
    Cache-Control = "no-store, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/decision-engine.html"
  [headers.values]
    Cache-Control = "no-store, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=300, stale-while-revalidate=86400"


# PUBLIC SITE POLICY
# No redirect from public Netlify to the internal GitHub Pages Command Center.
# Public Netlify serves only the explicit allowlist produced by netlify-public-build.sh.
# The Android app remains on its existing Pages URL until PRIVATE_WEB_GREEN.


[[redirects]]
  from = "/pilares"
  to = "/poll/pilares-lite-v2.html"
  status = 302

[[redirects]]
  from = "/referencias"
  to = "/poll/referencias-lite-v2.html"
  status = 302

[[redirects]]
  from = "/encuestas-resultados"
  to = "/survey-results.html"
  status = 302
