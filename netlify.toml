[build]
  command = "bash netlify-build.sh && bash ps4-audio-build.sh"
  publish = "build/site"

[build.environment]
  GODOT_VERSION = "4.7.2"
  ISL_MEDIA_POLICY = "hq-final-no-degraded-public-media"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
