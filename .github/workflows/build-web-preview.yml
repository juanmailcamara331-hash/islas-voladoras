name: Publicar ISL Command Center en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - ".github/workflows/build-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Componer portal ISL
        shell: bash
        run: |
          rm -rf build/pages
          mkdir -p build/pages
          cp -a portal/. build/pages/
          # Preview gratuito: misma entrada RPG que la release, sin tocar Netlify.
          cp build/pages/index.html build/pages/command-center.html
          cp build/pages/rpg-home.html build/pages/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/pages/ps4.html')
          s=p.read_text(encoding='utf-8')
          if 'ps4-runtime-hotfix.js' not in s:
              s=s.replace('</body>','<script defer src="ps4-runtime-hotfix.js"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          touch build/pages/.nojekyll
      - name: Cost audit
        run: python3 scripts/asset-budget.py
      - name: CQC portal
        shell: bash
        run: |
          test -f build/pages/index.html
          test -f build/pages/rpg-home.html
          test -f build/pages/command-center.html
          test -f build/pages/secret-level.html
          test -f build/pages/recreo-pixel.css
          grep -q 'DISTRITO RECREO' build/pages/recreo.html
          grep -q 'itemCloseX' build/pages/index.html
          grep -q 'rpgCommandDeck' build/pages/index.html
          grep -q 'Distrito Recreo' build/pages/recreo.html
          grep -q 'PERFIL COMPLETO' build/pages/index.html
          test -f build/pages/capsulas.html
          grep -q "Cabina de Expedición" build/pages/index.html
          grep -q 'src="assets/protagonist-sheet.png"' build/pages/index.html
          grep -q 'class="miniMap"' build/pages/index.html
          grep -q 'assets/floating-islands-map.png' build/pages/index.html
          grep -q 'class="hudStats"' build/pages/index.html
          test -f build/pages/ps4.html
          test -f build/pages/ps4-runtime-hotfix.js
          test -f build/pages/decision-engine.html
          test -f build/pages/poll/molino.html
          test -f build/pages/poll/gracias.html
          grep -q "ps4-runtime-hotfix.js" build/pages/ps4.html
          echo "CQC Pages OK"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
