name: Publicar ISL Command Center en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - ".github/workflows/build-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Componer portal ISL
        shell: bash
        run: |
          rm -rf build/pages
          mkdir -p build/pages/assets
          cp portal/index.html portal/styles.css portal/app.js portal/ps4.html portal/reel.html portal/404.html portal/manifest.webmanifest portal/content-manifest.json build/pages/
          cp portal/decision-engine.html portal/ISL_DECISION_ENGINE_CURRENT.json portal/ps4-runtime-hotfix.js build/pages/
          cp -a portal/labs build/pages/
          cp -a portal/poll build/pages/
          cp -a portal/assets/. build/pages/assets/
          python - <<'PY'
          from pathlib import Path
          p=Path('build/pages/ps4.html')
          s=p.read_text(encoding='utf-8')
          if 'ps4-runtime-hotfix.js' not in s:
              s=s.replace('</body>','<script defer src="ps4-runtime-hotfix.js"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          touch build/pages/.nojekyll
      - name: CQC portal
        shell: bash
        run: |
          test -f build/pages/index.html
          test -f build/pages/ps4.html
          test -f build/pages/ps4-runtime-hotfix.js
          test -f build/pages/decision-engine.html
          test -f build/pages/poll/molino.html
          test -f build/pages/poll/gracias.html
          grep -q "ps4-runtime-hotfix.js" build/pages/ps4.html
          echo "CQC Pages OK"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
