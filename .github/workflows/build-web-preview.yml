name: Publicar juego Godot automáticamente en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar controles Web sin modificar el código del juego
        shell: bash
        run: |
          cp scripts/player.gd /tmp/player.gd
          sed -i 's/if not OS.has_feature("mobile"):/if not OS.has_feature("mobile") and not OS.has_feature("web"):/1' scripts/player.gd
          sed -i '/func _unhandled_input(event: InputEvent) -> void:/a\    if event is InputEventMouseButton and event.pressed and not OS.has_feature("mobile"):\n        Input.mouse_mode = Input.MOUSE_MODE_CAPTURED\n        return\n    if event is InputEventKey and event.pressed and event.keycode == KEY_ESCAPE:\n        Input.mouse_mode = Input.MOUSE_MODE_VISIBLE\n        return' scripts/player.gd

      - name: Exportar exactamente como en Netlify
        shell: bash
        run: |
          bash netlify-build.sh
          mv /tmp/player.gd scripts/player.gd

      - name: Evitar caché de una exportación Web anterior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          v = os.environ["GITHUB_SHA"]
          s = re.sub(r'(\.(?:wasm|pck|js))"', r'\1?v=' + v + '"', s)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
