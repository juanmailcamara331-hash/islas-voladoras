name: Islas Voladoras Web Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          TAG="4.7.2-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${TAG}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "${BASE}/Godot_v${TAG}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          TEMPLATE_SRC="$RUNNER_TEMP/templates/templates"
          test -f "$TEMPLATE_SRC/web_nothreads_debug.zip"
          test -f "$TEMPLATE_SRC/web_nothreads_release.zip"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_SRC"/. "$TEMPLATE_DIR"/
          ls -lh "$TEMPLATE_DIR"/web*.zip
          godot --version

      - name: Export Godot Web
        shell: bash
        run: |
          set -euo pipefail
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=true
          progressive_web_app/offline_page=""
          progressive_web_app/display=1
          progressive_web_app/orientation=0
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0, 0, 0, 1)
          EOF
          rm -rf "$RUNNER_TEMP/godot-web"
          mkdir -p "$RUNNER_TEMP/godot-web" build/web
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Web" "$RUNNER_TEMP/godot-web/index.html"
          test -s "$RUNNER_TEMP/godot-web/index.html"
          cp -a "$RUNNER_TEMP/godot-web/." build/web/
          mkdir -p build/web/lab
          cp web/index.html build/web/lab/index.html
          cp web/README.md build/web/lab/README.md
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
