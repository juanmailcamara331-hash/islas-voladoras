name: Publicar ISL Command Center en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - ".github/workflows/build-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Componer portal ISL
        shell: bash
        run: |
          rm -rf build/pages
          mkdir -p build/pages
          cp -a portal/. build/pages/
          # Entrada pública: Bienvenida ISL → Perfil RPG. command-center.html conserva la vista técnica sin repetir bienvenida.
          cp build/pages/index.html build/pages/command-center.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/pages/ps4.html')
          s=p.read_text(encoding='utf-8')
          if 'ps4-runtime-hotfix.js' not in s:
              s=s.replace('</body>','<script defer src="ps4-runtime-hotfix.js"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          touch build/pages/.nojekyll
      - name: Cost audit
        run: python3 scripts/asset-budget.py
      - name: CQC portal
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::CQC failed rc=$rc line=$LINENO command=$BASH_COMMAND"; exit $rc' ERR
          echo "CQC_DIAG_VERSION=v0.62"
          test -f build/pages/index.html
          test -f build/pages/rpg-home.html
          test -f build/pages/command-center.html
          test -f build/pages/secret-level.html
          test -f build/pages/recreo-pixel.css
          grep -q 'DISTRITO RECREO' build/pages/recreo.html
          grep -q 'homeCabin' build/pages/index.html
          grep -q 'AHORA IMPORTA' build/pages/index.html
          grep -q 'REVISIÓN ACTUAL' build/pages/index.html
          grep -q 'id="welcome"' build/pages/index.html
          grep -q "location.href='rpg-home.html'" build/pages/index.html
          grep -q 'isTechnical=/command-center\\.html' build/pages/index.html
          ! grep -q '<div class="homeHeroIcons">' build/pages/index.html
          ! grep -q 'data-setting="welcome"' build/pages/index.html
          test -f build/pages/route-isl.js
          test -f build/pages/ISL_ROUTE_STATE_CURRENT.json
          grep -q 'route-isl.js' build/pages/index.html
          grep -q 'RUTA ISL' build/pages/route-isl.js
          grep -q "ISL_ROUTE_STATE_CURRENT.json" build/pages/route-isl.js
          grep -q '"current_stop": "pre50"' build/pages/ISL_ROUTE_STATE_CURRENT.json
          grep -q 'isl-route-v1-visited' build/pages/route-isl.js
          grep -q 'routeSceneGrid' build/pages/route-isl.js
          grep -q 'Botín / hitos' build/pages/route-isl.js
          grep -q 'routeNowAction' build/pages/route-isl.js
          grep -q 'VER PARADA ACTUAL' build/pages/route-isl.js
          grep -q 'routeProgress' build/pages/route-isl.js
          node --check build/pages/route-isl.js
          ! grep -Fq '\\n\\n    var stops' build/pages/route-isl.js
          grep -q '← Cabina RPG' build/pages/musica.html
          grep -q 'itemCloseX' build/pages/rpg-home.html
          grep -q 'rpgCommandDeck' build/pages/rpg-home.html
          grep -q 'sceneOverlay' build/pages/rpg-home.html
          grep -q 'gameHudBar' build/pages/rpg-home.html
          grep -q 'class="gameMenu"' build/pages/rpg-home.html
          grep -q 'class="sceneWindow"' build/pages/rpg-home.html
          grep -q 'id="useItem"' build/pages/rpg-home.html
          grep -q 'class="deckItem"' build/pages/rpg-home.html
          grep -q 'routeInventoryPanel' build/pages/rpg-home.html
          grep -q 'ISL_ROUTE_STATE_CURRENT.json' build/pages/rpg-home.html
          grep -q 'RELIQUIAS DE RUTA' build/pages/rpg-home.html
          grep -q '"route_inventory"' build/pages/ISL_ROUTE_STATE_CURRENT.json
          grep -q '"active_mission_item"' build/pages/ISL_ROUTE_STATE_CURRENT.json
          grep -q 'isl-cabin-fab' build/pages/command-center.html
          grep -q '100dvh' build/pages/command-center.html
          ! grep -q 'rpg-control-strip' build/pages/command-center.html
          ! grep -q 'rpgActivityBar' build/pages/rpg-home.html
          grep -q 'embed=1' build/pages/recreo.html
          test -f build/pages/capsulas.html
          test -f build/pages/huellas.html
          test -f build/pages/salon-cortinas-rojas.html
          test -f build/pages/isla-baile-inagotable.html
          test -f build/pages/poll/referencias-amigos.html
          test -f build/pages/poll/pilares-argumento.html
          grep -q 'No señala dónde ir.' build/pages/huellas.html
          grep -q 'Señala de dónde vienes.' build/pages/huellas.html
          grep -q 'isl_huellas_echoes_v1' build/pages/huellas.html
          grep -q 'isl_huellas_events_v2' build/pages/huellas.html
          grep -q 'data-mode="trance"' build/pages/huellas.html
          grep -q 'LABORATORIO DE HUELLA' build/pages/huellas.html
          grep -q 'Salón de las Cortinas Rojas' build/pages/salon-cortinas-rojas.html
          grep -q 'isl_red_room_state_v1' build/pages/salon-cortinas-rojas.html
          grep -q 'recoreografiar' build/pages/salon-cortinas-rojas.html
          grep -q 'Isla del Baile Inagotable' build/pages/isla-baile-inagotable.html
          grep -q 'isl_dance_island_v1' build/pages/isla-baile-inagotable.html
          grep -q 'JARDÍN SILENCIOSO' build/pages/isla-baile-inagotable.html
          grep -q 'NO COPIAMOS, MUTAMOS' build/pages/poll/referencias-amigos.html
          grep -q 'isl-reference-friends-01' build/pages/poll/referencias-amigos.html
          grep -q 'isl-pillars-01' build/pages/poll/pilares-argumento.html
          grep -q 'VALIDACIÓN DIALÉCTICA' build/pages/poll/pilares-argumento.html
          grep -q 'window.__ISL_NATIVE_APP__=true' build/pages/index.html
          grep -q "removeChild(w)" build/pages/index.html
          grep -q 'isl-center-v060-native-regression-guard' build/pages/sw.js
          test -f docs/ISL_BUILD_SCIENCE_v0.61.md
          test -f docs/ISL_ERROR_TAXONOMY_v0.61.json
          test -f docs/ISL_CHANGE_IMPACT_CARD_TEMPLATE_v0.61.md
          test -f docs/ISL_ENGINEERING_RESEARCH_LEDGER_v0.61.md
          grep -q 'href="huellas.html"' build/pages/rpg-home.html
          grep -q 'Metrónomo sin Dueño' build/pages/rpg-home.html
          grep -q 'Sello de Barro Vivo' build/pages/rpg-home.html
          grep -q 'Media Máscara del Aplauso' build/pages/rpg-home.html
          grep -q 'isl_huellas_events_v2' build/pages/rpg-home.html
          grep -q "Cabina de Expedición" build/pages/rpg-home.html
          grep -q 'src="assets/protagonist-sheet.png"' build/pages/rpg-home.html
          grep -q 'class="miniMap"' build/pages/rpg-home.html
          grep -q 'assets/floating-islands-map.png' build/pages/rpg-home.html
          grep -q 'class="hudStats"' build/pages/rpg-home.html
          grep -q 'RUTA v0.40 · PRE50 PENDIENTE' build/pages/rpg-home.html
          grep -q '<span>Inventario</span>' build/pages/rpg-home.html
          grep -q '<span>Aventura</span>' build/pages/rpg-home.html
          grep -q '<span>Centro</span>' build/pages/rpg-home.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          idx=Path('build/pages/index.html').read_text(encoding='utf-8')
          rpg=Path('build/pages/rpg-home.html').read_text(encoding='utf-8')
          crit=idx.index('No automatizar el criterio.')
          focus=idx.index('<section class="homeFocus">', crit)
          assert '<button' not in idx[crit:focus], 'Botón redundante después de criterio'
          farm=rpg.index('no se pueden “farmear”.')
          profile=rpg.index('<aside class="profile">', farm)
          assert '<button' not in rpg[farm:profile] and '<a class="btn' not in rpg[farm:profile], 'Botón redundante después de farmear'
          assert idx.count('id="enterISL"') == 1
          assert 'Ver Reel' not in idx[idx.index('id="welcome"'):idx.index('<div id="helpTip">')]
          assert rpg.index('<span>Inventario</span>') < rpg.index('<span>Aventura</span>') < rpg.index('<span>Recreo</span>') < rpg.index('<span>Música</span>') < rpg.index('<span>Centro</span>')
          for name,html in [('index',idx),('rpg',rpg)]:
              scripts='\n'.join(re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',html,re.I))
              Path('/tmp/'+name+'-inline.js').write_text(scripts,encoding='utf-8')
          print('UX hierarchy audit OK')
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/rpg-inline.js
          test -f build/pages/ps4.html
          test -f build/pages/ps4-runtime-hotfix.js
          test -f build/pages/decision-engine.html
          test -f build/pages/poll/molino.html
          test -f build/pages/poll/gracias.html
          grep -q "ps4-runtime-hotfix.js" build/pages/ps4.html
          grep -q 'welcomeBrandIcon' build/pages/index.html
          grep -q 'railBrandIcon' build/pages/index.html
          grep -q 'id=\"finalCommandCenter\"' build/pages/index.html
          grep -q 'La Brújula de las Huellas' build/pages/index.html
          grep -q 'isl-icon-master.png' build/pages/rpg-home.html
          grep -q 'isl-icon-master.png' build/pages/ps4.html
          grep -q 'PRE50 · EVIDENCIA HUMANA REAL' build/pages/ps4.html
          grep -q 'FIRST PLAYABLE' build/pages/ps4.html
          grep -q 'VERTICAL SLICE' build/pages/ps4.html
          grep -q '¬¬' build/pages/ps4.html
          grep -q '¬¬' build/pages/poll/molino.html
          test -s build/pages/isl-icon-master.png
          grep -q '"purpose": "any"' build/pages/manifest.webmanifest
          ! grep -q '<div class="logo">ISL</div>' build/pages/ps4.html
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'index.html':['ENTRAR EN ISL','rpg-home.html','welcomeBrandIcon','railBrandIcon'],
            'rpg-home.html':['RUTA v0.40 · PRE50 PENDIENTE','Inventario','Aventura','Recreo','Música','Centro'],
            'ps4.html':['PRE50 · EVIDENCIA HUMANA REAL','PRE60','FIRST PLAYABLE','VERTICAL SLICE','Alpha → Beta → Master']
          }
          root=Path('build/pages')
          for name,needles in checks.items():
              t=(root/name).read_text(encoding='utf-8')
              missing=[n for n in needles if n not in t]
              assert not missing, f'{name}: missing {missing}'
          print('Brand / flow / PS4 sync audit OK')
          PY
          echo "CQC Pages OK"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
