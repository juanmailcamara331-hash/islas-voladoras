name: Publicar ISL Command Center + juego en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - "project.godot"
      - "main.tscn"
      - "scripts/**"
      - "web/**"
      - "netlify-build.sh"
      - ".github/workflows/build-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar controles Web sin modificar el código fuente
        shell: bash
        run: |
          cp scripts/player.gd /tmp/player.gd
          trap 'cp /tmp/player.gd scripts/player.gd' EXIT
          sed -i 's/if not OS.has_feature("mobile"):/if not OS.has_feature("mobile") and not OS.has_feature("web"):/1' scripts/player.gd
          sed -i '/func _unhandled_input(event: InputEvent) -> void:/a\    if event is InputEventMouseButton and event.pressed and not OS.has_feature("mobile"):\n        Input.mouse_mode = Input.MOUSE_MODE_CAPTURED\n        return\n    if event is InputEventKey and event.pressed and event.keycode == KEY_ESCAPE:\n        Input.mouse_mode = Input.MOUSE_MODE_VISIBLE\n        return' scripts/player.gd

      - name: Exportar juego Web
        shell: bash
        run: bash netlify-build.sh

      - name: Componer portal ISL
        shell: bash
        run: |
          rm -rf build/pages
          mkdir -p build/pages/game
          cp portal/index.html build/pages/index.html
          cp portal/ps4.html build/pages/ps4.html
          cp portal/404.html build/pages/404.html
          cp portal/manifest.webmanifest build/pages/manifest.webmanifest
          touch build/pages/.nojekyll

          cat portal/_payload/chunk-* > /tmp/isl-payload.b64
          base64 -d /tmp/isl-payload.b64 > /tmp/isl-payload.zip
          unzip -q /tmp/isl-payload.zip -d build/pages

          cp -a build/web/. build/pages/game/
          rm -rf build/pages/_payload

      - name: CQC mínimo del sitio publicado
        shell: bash
        run: |
          test -f build/pages/index.html
          test -f build/pages/ps4.html
          test -f build/pages/game/index.html
          test -f build/pages/labs/wind.html
          test -f build/pages/labs/method.html
          test -f build/pages/assets/airships-last-waltz.mp3
          test -f build/pages/assets/isl-tv-reel.mp4
          echo "ISL Pages listo:"
          find build/pages -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
