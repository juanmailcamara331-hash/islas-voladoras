name: Deploy private ISL Command Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - PRIVATE_DEPLOY_TRIGGER.md

permissions:
  contents: read

jobs:
  deploy-private:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: f3cb9c63-9ff1-4de2-b6df-c8e6af403a4f
      PRIVATE_ALIAS: private-command
    steps:
      - uses: actions/checkout@v4

      - name: Require Netlify token
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not configured."
            exit 9
          fi

      - name: Verify Netlify token can access canonical project
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /tmp/netlify-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Accept: application/json" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")"
          if [ "$code" != "200" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN cannot access canonical project $NETLIFY_SITE_ID (HTTP $code). Create a fresh Netlify personal access token while signed into the team that owns islas-voladoras-isl-private, then replace the GitHub Actions secret NETLIFY_AUTH_TOKEN. Do not change project visibility."
            exit 10
          fi
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/netlify-project.json'))
          assert p.get('id')=='f3cb9c63-9ff1-4de2-b6df-c8e6af403a4f', 'unexpected Netlify project'
          print('NETLIFY PROJECT ACCESS=GREEN · '+str(p.get('name','canonical-private')))
          PY

      - name: Security gate
        run: python3 scripts/security-gate.py

      - name: Build private Command Center
        run: bash netlify-private-build.sh

      - name: Verify deploy artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f build/private/index.html
          test -f build/private/command-center.html
          test -f build/private/access-probe.html
          test -f build/private/_headers
          grep -q "X-Robots-Tag: noindex" build/private/_headers
          grep -q "Cache-Control: no-store, private" build/private/_headers

      - name: Link authorized Netlify project
        shell: bash
        run: |
          mkdir -p .netlify
          printf '{"siteId":"%s"}\n' "$NETLIFY_SITE_ID" > .netlify/state.json
          test -s .netlify/state.json

      - name: Deploy private SSO alias
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx -y netlify-cli@latest deploy \
            --dir=build/private \
            --site="$NETLIFY_SITE_ID" \
            --alias="$PRIVATE_ALIAS" \
            --auth="$NETLIFY_AUTH_TOKEN"

      - name: Deployment gate
        run: |
          echo "PRIVATE_NETLIFY_ALIAS=GREEN"
          echo "Expected protected alias: https://private-command--islas-voladoras-isl-private.netlify.app"
