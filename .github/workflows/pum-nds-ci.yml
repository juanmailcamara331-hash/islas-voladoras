name: ISL PUM NDS CI

on:
  push:
    branches: [lab/pum-nds]
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  pull_request:
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f labs/pum-nds/README.md
          test -f labs/pum-nds/AGENTS.md
          if [ -f labs/pum-nds/tools/validate.py ]; then
            python3 labs/pum-nds/tools/validate.py
          fi

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS
        working-directory: labs/pum-nds
        run: |
          test -f Makefile
          make
      - name: Host-side tests
        working-directory: labs/pum-nds
        run: |
          if [ -f tools/run_tests.sh ]; then sh tools/run_tests.sh; fi
      - name: Collect technical build
        run: |
          mkdir -p out
          find labs/pum-nds -maxdepth 2 -type f -name '*.nds' -exec cp {} out/ISL_PUM_TECH_PREVIEW.nds \;
          test -f out/ISL_PUM_TECH_PREVIEW.nds
          if [ -f labs/pum-nds/PLAYER_README.md ]; then cp labs/pum-nds/PLAYER_README.md out/; fi
      - name: Build R36 technical package
        run: |
          cp out/ISL_PUM_TECH_PREVIEW.nds labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds
          bash labs/pum-nds/deploy/make_r36_package.sh labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip
          cp labs/pum-nds/out/ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip out/
          rm -f labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds
          test -f out/ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: out
          if-no-files-found: error


  emulator_boot:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install legal HLE-capable emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y desmume xvfb xdotool openbox dosfstools mtools
          test -x /usr/games/desmume-cli
      - uses: actions/download-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: artifact
      - name: Locate ROM
        run: |
          find artifact -type f -name 'ISL_PUM_TECH_PREVIEW.nds' -print
          test -f artifact/ISL_PUM_TECH_PREVIEW.nds
      - name: EMULATOR_GREEN_BOOT smoke gate
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 8s xvfb-run -a /usr/games/desmume-cli             --disable-sound --disable-limiter             artifact/ISL_PUM_TECH_PREVIEW.nds             > emulator.log 2>&1
          rc=$?
          cat emulator.log
          if [ "$rc" -eq 124 ]; then
            echo "EMULATOR_GREEN_BOOT"
            exit 0
          fi
          echo "Emulator exited before smoke interval (rc=$rc)"
          exit "$rc"

      - name: DeSmuME DLDI capability probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/games/desmume-cli --help > desmume-help.txt 2>&1 || true
          cat desmume-help.txt
          if grep -q -- '--cflash' desmume-help.txt; then
            echo "DESMUME_DLDI_CAPABLE"
          else
            echo "DESMUME_DLDI_UNAVAILABLE_IN_THIS_BUILD"
          fi


  melonds_probe:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libfuse2 libegl1 libgl1
      - name: Download official melonDS 1.1 AppImage
        run: |
          curl -L --fail --retry 3 \
            https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-appimage-x86_64.zip \
            -o melonds.zip
          unzip -q melonds.zip
          find . -maxdepth 2 -type f -name '*.AppImage' -print
          appimage="$(find . -maxdepth 2 -type f -name '*.AppImage' | head -n1)"
          test -n "$appimage"
          chmod +x "$appimage"
          printf '%s\n' "$appimage" > melonds-path.txt
      - name: Probe melonDS command line
        shell: bash
        run: |
          set +e
          appimage="$(cat melonds-path.txt)"
          timeout 8s xvfb-run -a "$appimage" --appimage-extract-and-run --help > melonds-help.txt 2>&1
          rc=$?
          cat melonds-help.txt
          echo "melonDS help exit=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "MELONDS_PROBE_RUNTIME_FAILED"
            exit 1
          fi
          if grep -Eqi 'dldi|sd[ -]?card|storage' melonds-help.txt; then
            echo "MELONDS_STORAGE_CLI_HINT_FOUND"
          else
            echo "MELONDS_STORAGE_CLI_HINT_NOT_FOUND"
          fi
