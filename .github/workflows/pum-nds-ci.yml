name: ISL PUM NDS CI

on:
  push:
    branches: [lab/pum-nds]
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  pull_request:
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f labs/pum-nds/README.md
          test -f labs/pum-nds/AGENTS.md
          if [ -f labs/pum-nds/tools/validate.py ]; then
            python3 labs/pum-nds/tools/validate.py
          fi

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify NDS toolchain
        run: |
          test -f "$DEVKITARM/ds_rules"
          test -d "$DEVKITPRO/libnds"
          command -v ndstool
      - name: Build NDS
        working-directory: labs/pum-nds
        run: make
      - name: Host-side tests
        working-directory: labs/pum-nds
        run: |
          if [ -f tools/run_tests.sh ]; then sh tools/run_tests.sh; fi
      - name: Build spoiler-safe player package
        run: |
          set -eu
          rm -rf out
          mkdir -p out/R36_PACKAGE/roms/nds out/R36_PACKAGE/ISL_PUM
          cp labs/pum-nds/ISL_PUM_PLAYER.nds out/R36_PACKAGE/roms/nds/ISL_PUM.nds
          cp labs/pum-nds/PLAYER_README.md out/R36_PACKAGE/ISL_PUM/PLAYER_README.txt
          printf '%s\n' "$GITHUB_SHA" > out/R36_PACKAGE/ISL_PUM/VERSION.txt
          sha256sum out/R36_PACKAGE/roms/nds/ISL_PUM.nds > out/R36_PACKAGE/ISL_PUM/SHA256SUMS.txt
          cat > out/R36_PACKAGE/ISL_PUM/INSTALL.txt <<'TXT'
ISL PUM · PLAYER PACKAGE

1. Copy the CONTENTS of R36_PACKAGE to the games SD card.
2. Start the console.
3. Launch ISL_PUM from Nintendo DS.
4. Play.

Do not edit save files.
Do not read development files.
If anything fails, preserve the SD card contents and report only the visible error.
TXT
          {
            echo "build_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "branch=$GITHUB_REF_NAME"
            echo "gate_static=PASS"
            echo "gate_logic=PASS"
            echo "gate_fault=PASS"
            echo "gate_emulator=NOT_YET_VALIDATED"
            echo "gate_device=NOT_YET_VALIDATED"
            echo "gate_human=NOT_YET_VALIDATED"
          } > out/R36_PACKAGE/ISL_PUM/BUILD_MANIFEST.txt
          (cd out && zip -qr ISL_PUM_R36_PLAYER_PACKAGE.zip R36_PACKAGE)
          sha256sum out/ISL_PUM_R36_PLAYER_PACKAGE.zip > out/ISL_PUM_R36_PLAYER_PACKAGE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ISL_PUM_R36_PLAYER_PACKAGE
          path: |
            out/ISL_PUM_R36_PLAYER_PACKAGE.zip
            out/ISL_PUM_R36_PLAYER_PACKAGE.sha256
          if-no-files-found: error
