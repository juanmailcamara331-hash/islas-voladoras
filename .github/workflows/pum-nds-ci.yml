name: ISL PUM NDS CI

on:
  push:
    branches: [lab/pum-nds]
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  pull_request:
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f labs/pum-nds/README.md
          test -f labs/pum-nds/AGENTS.md
          if [ -f labs/pum-nds/tools/validate.py ]; then
            python3 labs/pum-nds/tools/validate.py
          fi

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS
        working-directory: labs/pum-nds
        run: |
          test -f Makefile
          make
      - name: Host-side tests
        working-directory: labs/pum-nds
        run: |
          if [ -f tools/run_tests.sh ]; then sh tools/run_tests.sh; fi
      - name: Collect technical build
        run: |
          mkdir -p out
          find labs/pum-nds -maxdepth 2 -type f -name '*.nds' -exec cp {} out/ISL_PUM_TECH_PREVIEW.nds \;
          test -f out/ISL_PUM_TECH_PREVIEW.nds
          if [ -f labs/pum-nds/PLAYER_README.md ]; then cp labs/pum-nds/PLAYER_README.md out/; fi
      - name: Build R36 technical package
        run: |
          cp out/ISL_PUM_TECH_PREVIEW.nds labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds
          bash labs/pum-nds/deploy/make_r36_package.sh labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip
          cp labs/pum-nds/out/ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip out/
          rm -f labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds
          test -f out/ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: out
          if-no-files-found: error


  emulator_boot:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install legal HLE-capable emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y desmume xvfb xdotool openbox dosfstools mtools
          test -x /usr/games/desmume-cli
      - uses: actions/download-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: artifact
      - name: Locate ROM
        run: |
          find artifact -type f -name 'ISL_PUM_TECH_PREVIEW.nds' -print
          test -f artifact/ISL_PUM_TECH_PREVIEW.nds
      - name: EMULATOR_GREEN_BOOT smoke gate
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 8s xvfb-run -a /usr/games/desmume-cli             --disable-sound --disable-limiter             artifact/ISL_PUM_TECH_PREVIEW.nds             > emulator.log 2>&1
          rc=$?
          cat emulator.log
          if [ "$rc" -eq 124 ]; then
            echo "EMULATOR_GREEN_BOOT"
            exit 0
          fi
          echo "Emulator exited before smoke interval (rc=$rc)"
          exit "$rc"

      - name: DeSmuME DLDI capability probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/games/desmume-cli --help > desmume-help.txt 2>&1 || true
          cat desmume-help.txt
          if grep -q -- '--cflash' desmume-help.txt; then
            echo "DESMUME_DLDI_CAPABLE"
          else
            echo "DESMUME_DLDI_UNAVAILABLE_IN_THIS_BUILD"
          fi



  melonds_dldi:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install melonDS gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip xvfb libegl1 libgl1 libopengl0 openbox xdotool dosfstools mtools libqt6multimedia6 libqt6network6 libqt6widgets6 libqt6gui6 libqt6core6t64 libsdl2-2.0-0 libenet7 libfaad2
      - uses: actions/download-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: artifact
      - name: Prepare official melonDS 1.1 portable DLDI harness
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-ubuntu-x86_64.zip \
            -o melonds.zip
          mkdir -p melonds-ubuntu
          unzip -q melonds.zip -d melonds-ubuntu

          melon_bin="$(find melonds-ubuntu -type f -name melonDS | head -n1)"
          test -n "$melon_bin"
          chmod +x "$melon_bin"
          ldd "$melon_bin" | tee melonds-ldd.txt
          ! grep -q 'not found' melonds-ldd.txt
          portable_dir="$(dirname "$melon_bin")/portable"
          mkdir -p "$portable_dir"

          dldi_img="$(pwd)/dldi.img"
          truncate -s 256M "$dldi_img"
          mkfs.vfat "$dldi_img" >/dev/null

          cat > "$portable_dir/melonDS.toml" <<EOF
          [Emu]
          ConsoleType = 0
          DirectBoot = true
          ExternalBIOSEnable = false

          [DLDI]
          Enable = true
          ImagePath = "$dldi_img"
          ImageSize = 1
          ReadOnly = false
          FolderSync = false
          FolderPath = ""

          [Instance0]
          JoystickID = -1

          [Instance0.Keyboard]
          A = 90
          B = 88
          X = 83
          Y = 65
          Start = 16777220
          Select = 16777248
          EOF

          printf '%s\n' "$portable_dir" > melonds-portable.txt
          printf '%s\n' "$(realpath "$melon_bin")" > melonds-runner.txt
          test -x "$(cat melonds-runner.txt)"
          mdir -i dldi.img ::/

      - name: MELONDS_GREEN_INPUT_SAVE_RELOAD gate
        shell: bash
        run: |
          set -euo pipefail
          runner="$(cat melonds-runner.txt)"
          rom="$(pwd)/artifact/ISL_PUM_TECH_PREVIEW.nds"
          test -f "$rom"

          drive_once() {
            local mutate="$1"
            local display_num="$2"

            Xvfb ":$display_num" -screen 0 1024x768x24 > "melon-xvfb-$display_num.log" 2>&1 &
            xvfb_pid=$!
            export DISPLAY=":$display_num"
            sleep 0.5
            openbox > "melon-openbox-$display_num.log" 2>&1 &
            wm_pid=$!
            sleep 0.5

            "$runner" --boot always "$rom" > melon-runtime.log 2>&1 &
            emu_pid=$!

            wid=""
            for i in $(seq 1 60); do
              wid=$(xdotool search --name "melonDS" 2>/dev/null | head -n1 || true)
              [ -n "$wid" ] && break
              sleep 0.25
            done

            if [ -z "$wid" ]; then
              echo "melonDS window not found"
              cat melon-runtime.log || true
              kill "$emu_pid" "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 30
            fi

            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "melonDS exited before input"
              cat melon-runtime.log || true
              kill "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 31
            fi

            xdotool windowactivate --sync "$wid" || true
            sleep 2

            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "melonDS exited after window activation"
              cat melon-runtime.log || true
              kill "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 32
            fi

            if [ "$mutate" = "yes" ]; then
              xdotool keydown --window "$wid" s
              sleep 0.2
              xdotool keyup --window "$wid" s
              sleep 0.8
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "melonDS exited during driven input"
              cat melon-runtime.log || true
              kill "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 33
            fi
            fi

            xdotool keydown --window "$wid" Return
            sleep 0.2
            xdotool keyup --window "$wid" Return
            sleep 0.6
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "melonDS exited during driven input"
              cat melon-runtime.log || true
              kill "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 33
            fi

            xdotool keydown --window "$wid" z
            sleep 0.2
            xdotool keyup --window "$wid" z
            sleep 1.0
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "melonDS exited during driven input"
              cat melon-runtime.log || true
              kill "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 33
            fi

            kill "$emu_pid" 2>/dev/null || true
            wait "$emu_pid" 2>/dev/null || true
            kill "$wm_pid" 2>/dev/null || true
            wait "$wm_pid" 2>/dev/null || true
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }

          drive_once yes 99
          cat melon-runtime.log || true
          mdir -i dldi.img ::/
          mcopy -i dldi.img ::/ISL_PUM_SAVE.bin first-save.bin

          python3 - <<'PY'
          import struct
          b=open("first-save.bin","rb").read()
          assert len(b) >= 32, len(b)
          magic,=struct.unpack_from("<I",b,0)
          schema,=struct.unpack_from("<H",b,4)
          checksum,=struct.unpack_from("<I",b,8)
          play_ticks,=struct.unpack_from("<I",b,16)
          relation_count,=struct.unpack_from("<I",b,24)
          assert magic == 0x49534C31, hex(magic)
          assert schema == 3, schema
          assert checksum != 0, checksum
          assert play_ticks > 0, play_ticks
          assert relation_count >= 1, relation_count
          print("melon first save", play_ticks, relation_count)
          PY

          drive_once no 100
          cat melon-runtime.log || true
          mdir -i dldi.img ::/
          mcopy -i dldi.img ::/ISL_PUM_SAVE.bin second-save.bin
          mcopy -i dldi.img ::/ISL_PUM_SAVE.bin.bak backup-save.bin

          python3 - <<'PY'
          import struct
          first=open("first-save.bin","rb").read()
          second=open("second-save.bin","rb").read()
          backup=open("backup-save.bin","rb").read()
          assert backup == first, "backup did not preserve prior generation"
          ticks1,=struct.unpack_from("<I",first,16)
          ticks2,=struct.unpack_from("<I",second,16)
          rel2,=struct.unpack_from("<I",second,24)
          assert ticks2 > ticks1, (ticks1,ticks2)
          assert rel2 >= 1, rel2
          assert second != first
          print("MELONDS_GREEN_INPUT_SAVE_RELOAD", ticks1, ticks2, rel2)
          PY
