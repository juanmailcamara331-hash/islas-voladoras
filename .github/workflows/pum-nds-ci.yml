name: ISL PUM NDS CI

on:
  push:
    branches: [lab/pum-nds]
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  pull_request:
    paths:
      - 'labs/pum-nds/**'
      - '.github/workflows/pum-nds-ci.yml'
      - '.github/instructions/pum-nds.instructions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f labs/pum-nds/README.md
          test -f labs/pum-nds/AGENTS.md
          if [ -f labs/pum-nds/tools/validate.py ]; then
            python3 labs/pum-nds/tools/validate.py
          fi

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS
        working-directory: labs/pum-nds
        run: |
          test -f Makefile
          make
      - name: Host-side tests
        working-directory: labs/pum-nds
        run: |
          if [ -f tools/run_tests.sh ]; then sh tools/run_tests.sh; fi
      - name: Collect technical build
        run: |
          mkdir -p out
          find labs/pum-nds -maxdepth 2 -type f -name '*.nds' -exec cp {} out/ISL_PUM_TECH_PREVIEW.nds \;
          test -f out/ISL_PUM_TECH_PREVIEW.nds
          if [ -f labs/pum-nds/PLAYER_README.md ]; then cp labs/pum-nds/PLAYER_README.md out/; fi
      - name: Build R36 technical package
        run: |
          cp out/ISL_PUM_TECH_PREVIEW.nds labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds
          bash labs/pum-nds/deploy/make_r36_package.sh labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip
          cp labs/pum-nds/out/ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip out/
          rm -f labs/pum-nds/ISL_PUM_TECH_PREVIEW.nds
          test -f out/ISL_PUM_R36_TECH_PREVIEW_PACKAGE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: out
          if-no-files-found: error


  emulator_boot:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install legal HLE-capable emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y desmume xvfb xdotool openbox dosfstools mtools
          test -x /usr/games/desmume-cli
      - uses: actions/download-artifact@v4
        with:
          name: ISL_PUM_TECH_PREVIEW
          path: artifact
      - name: Locate ROM
        run: |
          find artifact -type f -name 'ISL_PUM_TECH_PREVIEW.nds' -print
          test -f artifact/ISL_PUM_TECH_PREVIEW.nds
      - name: EMULATOR_GREEN_BOOT smoke gate
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 8s xvfb-run -a /usr/games/desmume-cli             --disable-sound --disable-limiter             artifact/ISL_PUM_TECH_PREVIEW.nds             > emulator.log 2>&1
          rc=$?
          cat emulator.log
          if [ "$rc" -eq 124 ]; then
            echo "EMULATOR_GREEN_BOOT"
            exit 0
          fi
          echo "Emulator exited before smoke interval (rc=$rc)"
          exit "$rc"

      - name: EMULATOR_GREEN_INPUT_SAVE roundtrip gate
        shell: bash
        run: |
          set -euo pipefail

          dd if=/dev/zero of=emulator-cflash.img bs=1M count=16 status=none
          mkfs.vfat emulator-cflash.img >/dev/null

          drive_once() {
            local mutate="$1"
            local display_num="$2"
            Xvfb ":$display_num" -screen 0 1024x768x24 > "xvfb-$display_num.log" 2>&1 &
            xvfb_pid=$!
            export DISPLAY=":$display_num"
            sleep 0.5
            openbox > "openbox-$display_num.log" 2>&1 &
            wm_pid=$!
            sleep 0.5

            /usr/games/desmume-cli --disable-sound --disable-limiter --cflash=emulator-cflash.img artifact/ISL_PUM_TECH_PREVIEW.nds > emulator-input.log 2>&1 &
            emu_pid=$!

            wid=""
            for i in $(seq 1 40); do
              wid=$(xdotool search --name "Desmume" 2>/dev/null | head -n1 || true)
              [ -n "$wid" ] && break
              sleep 0.25
            done

            if [ -z "$wid" ]; then
              cat emulator-input.log || true
              kill "$emu_pid" "$wm_pid" "$xvfb_pid" 2>/dev/null || true
              exit 20
            fi

            xdotool windowactivate --sync "$wid"
            sleep 1
            if [ "$mutate" = "yes" ]; then
              xdotool keydown --window "$wid" s
              sleep 0.2
              xdotool keyup --window "$wid" s
              sleep 0.5
            fi
            xdotool keydown --window "$wid" Return
            sleep 0.2
            xdotool keyup --window "$wid" Return
            sleep 0.5
            xdotool keydown --window "$wid" z
            sleep 0.2
            xdotool keyup --window "$wid" z
            sleep 1

            kill "$emu_pid" 2>/dev/null || true
            wait "$emu_pid" 2>/dev/null || true
            kill "$wm_pid" 2>/dev/null || true
            wait "$wm_pid" 2>/dev/null || true
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }

          drive_once yes 99
          cat emulator-input.log || true
          mdir -i emulator-cflash.img ::/
          mcopy -i emulator-cflash.img ::/ISL_PUM_SAVE.bin first-save.bin

          python3 - <<'PY'
          import struct
          b=open("first-save.bin","rb").read()
          assert len(b) >= 28, len(b)
          magic,=struct.unpack_from("<I",b,0)
          schema,=struct.unpack_from("<H",b,4)
          relation_count,=struct.unpack_from("<I",b,24)
          assert magic == 0x49534C31, hex(magic)
          assert schema >= 2, schema
          assert relation_count >= 1, relation_count
          print("first persisted relation_count",relation_count)
          PY

          drive_once no 100
          cat emulator-input.log || true
          mdir -i emulator-cflash.img ::/
          mcopy -i emulator-cflash.img ::/ISL_PUM_SAVE.bin second-save.bin
          mcopy -i emulator-cflash.img ::/ISL_PUM_SAVE.bin.bak backup-save.bin

          python3 - <<'PY'
          import struct
          first=open("first-save.bin","rb").read()
          second=open("second-save.bin","rb").read()
          backup=open("backup-save.bin","rb").read()
          assert backup == first, "backup did not preserve first persisted generation"
          relation_count,=struct.unpack_from("<I",second,24)
          assert relation_count >= 1, relation_count
          assert second != first, "relaunch/save did not advance persisted state"
          print("EMULATOR_GREEN_INPUT_SAVE",relation_count)
          PY
