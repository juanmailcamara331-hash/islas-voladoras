name: Build ISL Web App APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-web/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: isl-web-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/cmdline.zip" "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: isl-android-debug-keystore-v1

      - name: Prepare stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=ISL Debug,O=Pandaria,C=ES"               -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "stable debug signing key: OK"

      - name: Stamp build version
        shell: bash
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android-web/app/build.gradle
          sed -i "s/versionName '1.0'/versionName '1.0.${GITHUB_RUN_NUMBER}'/" android-web/app/build.gradle

      - name: Verify Pages coherence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/workflows/build-web-preview.yml/runs?branch=main&status=success&per_page=1")"
          status="$(printf '%s' "$json" | jq -r '.workflow_runs[0].status // "missing"')"
          conclusion="$(printf '%s' "$json" | jq -r '.workflow_runs[0].conclusion // "missing"')"
          pages_sha="$(printf '%s' "$json" | jq -r '.workflow_runs[0].head_sha // "missing"')"
          echo "PAGES_STATUS=$status"
          echo "PAGES_CONCLUSION=$conclusion"
          echo "PAGES_BUILD_SHA=$pages_sha"
          test "$status" = "completed"
          test "$conclusion" = "success"

      - name: Verify web wrapper target
        shell: bash
        run: |
          ! grep -Rqi "project.godot\|scripts/main.gd\|GODOT_VERSION" .github/workflows/build-android-apk.yml android-web
          grep -q "juanmailcamara331-hash.github.io/islas-voladoras" android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q 'app=1' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q "com.pandaria.islasvoladoras" android-web/app/build.gradle
          grep -q '@mipmap/ic_launcher' android-web/app/src/main/AndroidManifest.xml
          test -s android-web/app/src/main/res/drawable/isl_launcher.xml
          test -s android-web/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android-web/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s android-web/app/src/main/res/values/colors.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android-web/app/src/main/AndroidManifest.xml
          grep -q '@color/isl_launcher_bg' android-web/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/isl_launcher_final' android-web/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '#071017' android-web/app/src/main/res/values/colors.xml
          test -s android-web/app/src/main/res/drawable-nodpi/isl_launcher_final.png
          file android-web/app/src/main/res/drawable-nodpi/isl_launcher_final.png | grep -q 'PNG image data'
          echo "adaptive ISL launcher: dark background + valid artistic PNG foreground OK"
          grep -q 'setBuiltInZoomControls(false)' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q 'setSupportZoom(false)' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q 'setUseWideViewPort(false)' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q 'setLoadWithOverviewMode(false)' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q 'LOAD_NO_CACHE' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          grep -q 'clearCache(true)' android-web/app/src/main/java/com/pandaria/islasvoladoras/MainActivity.java
          echo "zoom/cache wrapper: OK"

      - name: Build APK
        working-directory: android-web
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-web/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml'
          unzip -l "$APK" | grep -q 'res/drawable-nodpi-v4/isl_launcher_foreground.webp'
          echo "APK signature + artistic adaptive icon resources: OK"
          cp "$APK" "ISL-Command-Center.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISL-Command-Center-APK-${{ github.run_number }}
          path: ISL-Command-Center.apk
          if-no-files-found: error
          retention-days: 30
