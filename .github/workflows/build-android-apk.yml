name: Build Islas Voladoras APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: islas-voladoras-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"
      PACKAGE_ID: "com.pandaria.islasvoladoras"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate ZG project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project.godot ] && [ -f scripts/main.gd ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          elif [ -f ZG_ISLAS_ORIGINAL.zip ]; then
            mkdir -p "$RUNNER_TEMP/zg"
            unzip -q ZG_ISLAS_ORIGINAL.zip -d "$RUNNER_TEMP/zg"
            PROJECT="$(find "$RUNNER_TEMP/zg" -name project.godot -print -quit)"
            test -n "$PROJECT"
            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          else
            echo "ERROR: falta el checkpoint ZG completo." >&2
            exit 1
          fi

      - name: Patch ZG ramps for Android checkpoint
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/scripts/main.gd"
          test -f "$MAIN"
          python3 - "$MAIN" <<'PY'
          import re, sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          m=re.search(r'(?m)^func _nav_connector\([^\n]*\):\n(?P<body>(?:\t.*\n|\s*\n)*)',s)
          if not m:
              print('ERROR: _nav_connector no encontrado', file=sys.stderr); sys.exit(1)
          body=m.group('body')
          # Preserve the checkpoint logic but make every generated connector physically walkable:
          # add a StaticBody3D collision matching each MeshInstance3D connector if absent.
          if 'ZG_AUTORAMP_COLLISION_V1' not in s:
              insert='''\n# ZG_AUTORAMP_COLLISION_V1: physical authority belongs to the mathematical connector.\nfunc _zg_make_ramp_walkable(mesh_node: MeshInstance3D) -> void:\n\tif mesh_node == null or mesh_node.mesh == null:\n\t\treturn\n\tif mesh_node.get_node_or_null("ZG_RampBody") != null:\n\t\treturn\n\tvar body := StaticBody3D.new()\n\tbody.name = "ZG_RampBody"\n\tvar shape := CollisionShape3D.new()\n\tshape.name = "ZG_RampCollision"\n\tshape.shape = mesh_node.mesh.create_trimesh_shape()\n\tbody.add_child(shape)\n\tmesh_node.add_child(body)\n\nfunc _zg_finalize_generated_ramps(root: Node) -> void:\n\tif root is MeshInstance3D:\n\t\tvar mi := root as MeshInstance3D\n\t\tvar n := mi.name.to_lower()\n\t\tif "ramp" in n or "connector" in n or "bridge" in n:\n\t\t\t_zg_make_ramp_walkable(mi)\n\tfor child in root.get_children():\n\t\t_zg_finalize_generated_ramps(child)\n'''
              s += insert
          # Call deferred after the level has been generated, without changing controls/camera/player.
          ready=re.search(r'(?m)^func _ready\(\)[^\n]*:\n',s)
          if ready and '_zg_finalize_generated_ramps(self)' not in s[:ready.start()+2500]:
              pos=ready.end()
              s=s[:pos]+'\tcall_deferred("_zg_finalize_generated_ramps", self)\n'+s[pos:]
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Enable Android texture compression
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$PROJECT_DIR/project.godot"
          test -f "$PROJECT_FILE"
          if grep -q '^\[rendering\]' "$PROJECT_FILE"; then
            sed -i '/^textures\/vram_compression\/import_etc2_astc=/d' "$PROJECT_FILE"
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' "$PROJECT_FILE"
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> "$PROJECT_FILE"
          fi

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/cmdline.zip" "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${TAG}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "${BASE}/Godot_v${TAG}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          TEMPLATE_SRC="$(find "$RUNNER_TEMP/templates" -type d -name templates -print -quit)"
          test -n "$TEMPLATE_SRC"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_SRC"/. "$TEMPLATE_DIR"/
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then DEBUG_APK="$(find "$RUNNER_TEMP/templates" -type f -name 'android_debug.apk' -print -quit)"; test -n "$DEBUG_APK"; cp "$DEBUG_APK" "$TEMPLATE_DIR/android_debug.apk"; fi
          if [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then RELEASE_APK="$(find "$RUNNER_TEMP/templates" -type f -name 'android_release.apk' -print -quit)"; test -n "$RELEASE_APK"; cp "$RELEASE_APK" "$TEMPLATE_DIR/android_release.apk"; fi
          godot --version

      - name: Configure Android paths for Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          EOF

      - name: Prepare Android export preset
        shell: bash
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/Islas-Voladoras-debug.apk"
          script_export_mode=2
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="${PACKAGE_ID}"
          package/name="Islas Voladoras"
          version/code=${GITHUB_RUN_NUMBER}
          version/name="0.0.${GITHUB_RUN_NUMBER}"
          package/signed=true
          EOF

      - name: Import and validate project
        shell: bash
        run: godot --headless --editor --quit --path "$PROJECT_DIR"

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/build/android"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/android/Islas-Voladoras-debug.apk"
          test -s "$PROJECT_DIR/build/android/Islas-Voladoras-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Islas-Voladoras-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/build/android/Islas-Voladoras-debug.apk
          if-no-files-found: error
          retention-days: 30
